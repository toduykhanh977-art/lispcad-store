<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400' width='600' height='400'>
  <rect width='100%' height='100%' fill='#091422'/>
  <defs>
    <pattern id='grid2' width='20' height='20' patternUnits='userSpaceOnUse'>
      <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#14273e' stroke-width='0.8'/>
    </pattern>
  </defs>
  <rect width='100%' height='100%' fill='url(#grid2)'/>
  <text x='30' y='40' fill='#f59e0b' font-family='sans-serif' font-weight='bold' font-size='18'>BỘ THƯ VIỆN NỘI THẤT: SOFA &amp; BÀN ĂN CAD 2D</text>
  <text x='30' y='65' fill='#94a3b8' font-family='sans-serif' font-size='12'>Bản vẽ phối cảnh bố trí mặt bằng nội thất chuẩn</text>
  <!-- Sofa L -->
  <g transform='translate(40, 100)'>
    <rect x='0' y='0' width='200' height='60' rx='8' fill='#1e293b' stroke='#f59e0b' stroke-width='2'/>
    <rect x='0' y='60' width='70' height='120' rx='8' fill='#1e293b' stroke='#f59e0b' stroke-width='2'/>
    <!-- Cushions -->
    <rect x='75' y='10' width='55' height='45' rx='4' fill='#0f172a' stroke='#fbbf24' stroke-width='1'/>
    <rect x='135' y='10' width='55' height='45' rx='4' fill='#0f172a' stroke='#fbbf24' stroke-width='1'/>
    <rect x='10' y='70' width='50' height='50' rx='4' fill='#0f172a' stroke='#fbbf24' stroke-width='1'/>
    <rect x='10' y='125' width='50' height='45' rx='4' fill='#0f172a' stroke='#fbbf24' stroke-width='1'/>
    <!-- Tea table -->
    <rect x='90' y='80' width='100' height='60' rx='10' fill='#0f172a' stroke='#38bdf8' stroke-width='2'/>
    <text x='30' y='210' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Sofa góc chữ L &amp; Bàn trà</text>
  </g>
  <!-- Dining table 6 seats -->
  <g transform='translate(330, 100)'>
    <rect x='40' y='40' width='160' height='90' rx='12' fill='#1e293b' stroke='#10b981' stroke-width='2'/>
    <!-- Chairs top -->
    <rect x='55' y='10' width='35' height='25' rx='4' fill='#0f172a' stroke='#34d399' stroke-width='1.5'/>
    <rect x='102' y='10' width='35' height='25' rx='4' fill='#0f172a' stroke='#34d399' stroke-width='1.5'/>
    <rect x='150' y='10' width='35' height='25' rx='4' fill='#0f172a' stroke='#34d399' stroke-width='1.5'/>
    <!-- Chairs bottom -->
    <rect x='55' y='135' width='35' height='25' rx='4' fill='#0f172a' stroke='#34d399' stroke-width='1.5'/>
    <rect x='102' y='135' width='35' height='25' rx='4' fill='#0f172a' stroke='#34d399' stroke-width='1.5'/>
    <rect x='150' y='135' width='35' height='25' rx='4' fill='#0f172a' stroke='#34d399' stroke-width='1.5'/>
    <text x='55' y='210' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Bàn ăn 6 ghế tiêu chuẩn</text>
  </g>
  <!-- Master Bed -->
  <g transform='translate(170, 250)'>
    <rect x='0' y='0' width='160' height='120' rx='6' fill='#1e293b' stroke='#a855f7' stroke-width='2'/>
    <rect x='15' y='10' width='55' height='35' rx='4' fill='#0f172a' stroke='#c084fc' stroke-width='1'/>
    <rect x='90' y='10' width='55' height='35' rx='4' fill='#0f172a' stroke='#c084fc' stroke-width='1'/>
    <line x1='10' y1='55' x2='150' y2='55' stroke='#c084fc' stroke-width='1.5' stroke-dasharray='4,3'/>
    <!-- Nightstands -->
    <rect x='-35' y='5' width='25' height='35' rx='3' fill='#0f172a' stroke='#a855f7' stroke-width='1.5'/>
    <rect x='170' y='5' width='25' height='35' rx='3' fill='#0f172a' stroke='#a855f7' stroke-width='1.5'/>
    <text x='180' y='75' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Giường ngủ King Size 1.8x2m</text>
  </g>
</svg>