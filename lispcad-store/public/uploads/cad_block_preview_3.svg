<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400' width='600' height='400'>
  <rect width='100%' height='100%' fill='#091422'/>
  <defs>
    <pattern id='grid3' width='20' height='20' patternUnits='userSpaceOnUse'>
      <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#14273e' stroke-width='0.8'/>
    </pattern>
  </defs>
  <rect width='100%' height='100%' fill='url(#grid3)'/>
  <text x='30' y='40' fill='#10b981' font-family='sans-serif' font-weight='bold' font-size='18'>BỘ THƯ VIỆN THIẾT BỊ VỆ SINH &amp; CÂY XANH CAD 2D</text>
  <text x='30' y='65' fill='#94a3b8' font-family='sans-serif' font-size='12'>Bản vẽ thiết bị vệ sinh, cây cảnh mặt bằng và ô tô</text>
  <!-- Toilet -->
  <g transform='translate(50, 110)'>
    <rect x='10' y='0' width='50' height='25' rx='3' fill='#1e293b' stroke='#00d2ff' stroke-width='2'/>
    <path d='M 15 25 C 15 70, 55 70, 55 25 Z' fill='#0f172a' stroke='#00d2ff' stroke-width='2'/>
    <text x='0' y='105' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Bồn cầu vệ sinh</text>
  </g>
  <!-- Lavabo -->
  <g transform='translate(170, 110)'>
    <rect x='0' y='0' width='70' height='55' rx='6' fill='#1e293b' stroke='#00d2ff' stroke-width='2'/>
    <ellipse cx='35' cy='28' rx='25' ry='18' fill='#0f172a' stroke='#00d2ff' stroke-width='1.5'/>
    <circle cx='35' cy='18' r='3' fill='#38bdf8'/>
    <text x='5' y='105' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Chậu rửa Lavabo</text>
  </g>
  <!-- Tree -->
  <g transform='translate(310, 110)'>
    <circle cx='45' cy='45' r='40' fill='#064e3b' stroke='#10b981' stroke-width='2' stroke-dasharray='6,3'/>
    <circle cx='45' cy='45' r='25' fill='#022c22' stroke='#34d399' stroke-width='1.5'/>
    <circle cx='45' cy='45' r='4' fill='#34d399'/>
    <text x='5' y='115' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Cây xanh bóng mát</text>
  </g>
  <!-- Car top view -->
  <g transform='translate(140, 240)'>
    <rect x='0' y='15' width='220' height='100' rx='25' fill='#1e293b' stroke='#ec4899' stroke-width='2'/>
    <!-- Windshields -->
    <rect x='50' y='25' width='45' height='80' rx='8' fill='#0f172a' stroke='#f472b6' stroke-width='1.5'/>
    <rect x='130' y='25' width='45' height='80' rx='8' fill='#0f172a' stroke='#f472b6' stroke-width='1.5'/>
    <line x1='95' y1='25' x2='95' y2='105' stroke='#f472b6' stroke-width='1'/>
    <!-- Wheels -->
    <rect x='30' y='5' width='35' height='10' rx='2' fill='#0f172a' stroke='#e2e8f0' stroke-width='1'/>
    <rect x='155' y='5' width='35' height='10' rx='2' fill='#0f172a' stroke='#e2e8f0' stroke-width='1'/>
    <rect x='30' y='115' width='35' height='10' rx='2' fill='#0f172a' stroke='#e2e8f0' stroke-width='1'/>
    <rect x='155' y='115' width='35' height='10' rx='2' fill='#0f172a' stroke='#e2e8f0' stroke-width='1'/>
    <text x='240' y='70' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Ô tô 5 chỗ Sedan</text>
  </g>
</svg>