<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400' width='600' height='400'>
  <rect width='100%' height='100%' fill='#091422'/>
  <defs>
    <pattern id='grid' width='20' height='20' patternUnits='userSpaceOnUse'>
      <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#14273e' stroke-width='0.8'/>
    </pattern>
  </defs>
  <rect width='100%' height='100%' fill='url(#grid)'/>
  <text x='30' y='40' fill='#38bdf8' font-family='sans-serif' font-weight='bold' font-size='18'>BỘ THƯ VIỆN CỬA ĐI &amp; CỬA SỔ CAD 2D</text>
  <text x='30' y='65' fill='#94a3b8' font-family='sans-serif' font-size='12'>Bản vẽ mặt bằng kiến trúc tỷ lệ 1:100</text>
  <!-- Door 1 (Single leaf) -->
  <g transform='translate(50, 100)'>
    <rect x='0' y='0' width='20' height='120' fill='#1e293b' stroke='#00d2ff' stroke-width='2'/>
    <rect x='160' y='0' width='20' height='120' fill='#1e293b' stroke='#00d2ff' stroke-width='2'/>
    <line x1='20' y1='20' x2='20' y2='140' stroke='#f59e0b' stroke-width='3'/>
    <path d='M 20 140 A 120 120 0 0 0 140 20' fill='none' stroke='#38bdf8' stroke-width='2' stroke-dasharray='4,4'/>
    <line x1='20' y1='20' x2='140' y2='20' stroke='#38bdf8' stroke-width='2'/>
    <text x='40' y='180' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Cửa đi 1 cánh D900</text>
  </g>
  <!-- Door 2 (Double leaf) -->
  <g transform='translate(310, 100)'>
    <rect x='0' y='0' width='20' height='120' fill='#1e293b' stroke='#00d2ff' stroke-width='2'/>
    <rect x='220' y='0' width='20' height='120' fill='#1e293b' stroke='#00d2ff' stroke-width='2'/>
    <line x1='20' y1='20' x2='20' y2='100' stroke='#f59e0b' stroke-width='3'/>
    <line x1='220' y1='20' x2='220' y2='100' stroke='#f59e0b' stroke-width='3'/>
    <path d='M 20 100 A 100 100 0 0 0 120 20' fill='none' stroke='#38bdf8' stroke-width='2' stroke-dasharray='4,4'/>
    <path d='M 220 100 A 100 100 0 0 1 120 20' fill='none' stroke='#38bdf8' stroke-width='2' stroke-dasharray='4,4'/>
    <text x='50' y='180' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Cửa đi 2 cánh D1600</text>
  </g>
  <!-- Window 4-pane -->
  <g transform='translate(120, 260)'>
    <rect x='0' y='0' width='360' height='30' fill='#0f172a' stroke='#00d2ff' stroke-width='2'/>
    <line x1='90' y1='0' x2='90' y2='30' stroke='#00d2ff' stroke-width='1.5'/>
    <line x1='180' y1='0' x2='180' y2='30' stroke='#00d2ff' stroke-width='2'/>
    <line x1='270' y1='0' x2='270' y2='30' stroke='#00d2ff' stroke-width='1.5'/>
    <line x1='10' y1='15' x2='350' y2='15' stroke='#34d399' stroke-width='2'/>
    <text x='110' y='65' fill='#e2e8f0' font-family='sans-serif' font-size='13'>Cửa sổ 4 cánh nhôm kính S2400</text>
  </g>
</svg>